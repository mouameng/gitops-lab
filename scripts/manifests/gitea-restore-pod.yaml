apiVersion: v1
kind: Pod
metadata:
  name: gitea-restore
  namespace: gitea
spec:
  restartPolicy: Never
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
  containers:
    - name: restore
      image: docker.gitea.com/gitea:1.27.0-rootless
      command: ["sh", "-c", "sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: gitea-shared-storage
