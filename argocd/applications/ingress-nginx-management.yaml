apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-management
  namespace: argocd

spec:
  project: infrastructure

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.13.3

    helm:
      values: |
        controller:
          hostPort:
            enabled: true

          service:
            type: ClusterIP

  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
