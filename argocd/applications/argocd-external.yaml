apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-external
  namespace: argocd

spec:
  project: infrastructure

  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/platform/infrastructure-devops.git
    targetRevision: main
    path: applications/argocd

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
