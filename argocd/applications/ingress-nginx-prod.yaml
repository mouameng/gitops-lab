apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx-prod
  namespace: argocd
spec:
  project: infrastructure

  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.13.3

    helm:
      values: |
        controller:
          hostPort:
            enabled: true

          service:
            type: LoadBalancer
            annotations:
              metallb.io/loadBalancerIPs: "172.18.255.200"

  destination:
    name: workload-prod
    namespace: ingress-nginx

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true