apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: workload-dev-cluster
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "40"

spec:
  project: applications

  source:
    repoURL: https://github.com/mouameng/gitops-lab.git
    targetRevision: main
    path: applications/clusters/workload-dev

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
