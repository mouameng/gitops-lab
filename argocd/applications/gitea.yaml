apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
spec:
  project: infrastructure
  sources:
    - repoURL: https://dl.gitea.io/charts
      chart: gitea
      targetRevision: 12.7.0
      helm:
        releaseName: gitea
        valueFiles:
          - $values/infrastructure/gitea/values.yaml
    - repoURL: http://gitea-http.gitea.svc.cluster.local:3000/platform/infrastructure-devops.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
