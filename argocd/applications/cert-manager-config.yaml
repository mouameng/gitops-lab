# argocd/applications/cert-manager-config.yaml

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-config
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "-25"

spec:
  project: infrastructure

  source:
    repoURL: https://github.com/mouameng/gitops-lab.git
    targetRevision: main
    path: infrastructure/cert-manager

  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager

  syncPolicy:
    automated:
      prune: true
      selfHeal: true