apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
spec:
  project: applications

  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/platform/infrastructure-devops.git
    targetRevision: HEAD
    path: applications/whoami/overlays/dev

  destination:
    name: workload-dev
    namespace: whoami

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true