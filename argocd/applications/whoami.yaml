apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whoami
  namespace: argocd
spec:
  project: applications

  source:
    repoURL: https://github.com/mouameng/gitops-lab.git
    targetRevision: HEAD
    path: applications/whoami

  destination:
    name: workload-dev
    namespace: whoami

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true