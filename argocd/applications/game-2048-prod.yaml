apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: game-2048-prod
  namespace: argocd
spec:
  project: applications

  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/gitea_admin/gitops-lab.git
    targetRevision: HEAD
    path: applications/games/2048/overlays/prod

  destination:
    name: workload-prod
    namespace: game-2048

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
