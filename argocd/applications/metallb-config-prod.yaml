apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config-prod
  namespace: argocd
spec:
  project: infrastructure

  source:
    repoURL: http://gitea-http.gitea.svc.cluster.local:3000/platform/infrastructure-devops.git
    targetRevision: HEAD
    path: infrastructure/metallb/overlays/prod

  destination:
    name: workload-prod
    namespace: metallb-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true