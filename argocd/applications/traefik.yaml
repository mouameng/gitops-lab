apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: traefik
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "30"

spec:
  project: infrastructure

  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 37.1.0
  
    helm:
      values: |
        service:
          type: LoadBalancer

        ingressRoute:
          dashboard:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
