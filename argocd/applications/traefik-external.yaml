apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: traefik-external
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: "40"

spec:
  project: applications

  source:
    repoURL: https://github.com/mouameng/gitops-lab.git
    targetRevision: main
    path: applications/traefik

  destination:
    server: https://kubernetes.default.svc
    namespace: traefik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
